services:
  app:
    environment:
      DATABASE_URL: postgresql://uno:${UNO_POSTGRES_PASSWORD:?Set UNO_POSTGRES_PASSWORD in .env}@db:5432/uno
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    mem_limit: 384m
    environment:
      POSTGRES_DB: uno
      POSTGRES_USER: uno
      POSTGRES_PASSWORD: ${UNO_POSTGRES_PASSWORD:?Set UNO_POSTGRES_PASSWORD in .env}
    volumes:
      - uno-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uno -d uno"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  cache:
    image: redis:7-alpine
    mem_limit: 160m
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  uno-postgres:
