services:
  app:
    build: .
    platform: linux/amd64
    ports:
      - "8080:8080"
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/uno.sqlite3
    volumes:
      - trip-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  trip-data:
